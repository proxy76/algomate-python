# /etc/nginx/sites-available/python.algomate.ro
# certbot --nginx adds the TLS server block; if you use Cloudflare Tunnel,
# leave this as is (plain HTTP on the VM, TLS terminated by Cloudflare).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name python.algomate.ro;

    client_max_body_size 1m;

    # Behind Cloudflare's proxy (orange cloud) without a tunnel? Uncomment and
    # keep the list current: https://www.cloudflare.com/ips/
    # set_real_ip_from 173.245.48.0/20;
    # ... (all Cloudflare ranges)
    # real_ip_header CF-Connecting-IP;

    location /api/run {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }

    location /assets/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
